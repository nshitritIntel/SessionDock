name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release versions
        shell: pwsh
        run: ./scripts/validate-version.ps1

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Test updater manifest normalization
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-normalize-updater-manifest.ps1

      - name: Rust format check
        run: cargo fmt -- --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build frontend
        run: npm run build

      - name: Rust build check
        run: cargo build --locked
        working-directory: src-tauri
